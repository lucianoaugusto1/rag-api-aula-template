[project]
name = "rag-api-aula-template"
version = "0.1.0"
description = "Setup inicial para os alunos implementarem uma API de busca RAG com FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "groq>=1.6.0",
    "nltk>=3.10.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.1",
    "uvicorn[standard]>=0.52.3",
]
